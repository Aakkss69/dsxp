# DSXP feedback settings (format 1)
#
# What the controller does back: adaptive triggers, rumble and the light bar, and the
# flight-model numbers behind their simulator modes.
#
# DSXP applies changes to this file within about 2 seconds while it runs.
# The mapper window also writes this file: your values are kept, but comments
# you add yourself are lost when it does.
# A line DSXP cannot use is ignored and listed in the mapper and the menu.
# Delete a line to use its default; delete the file to reset all of it.

# ===== Adaptive triggers =====

# manual: the triggers use the effects set below.
# wind: X-Plane's airflow sets them (rudder-pedal force, crosswind, buffet); the manual
# values below are kept and come back when you switch to manual.
#   One of: manual, wind   Default manual
trigger.source = manual

# Effect on L2 (left trigger):
# off, resist (constant force past a point), weapon (resists across a band, then breaks
# through like a gun trigger) or vibrate.
#   One of: off, resist, weapon, vibrate   Default off
trigger.left.mode = off

# Where the effect begins, as a share of trigger travel (vibrate: the threshold).
# Lower: you feel it almost at once. Higher: free travel first. The trigger has 10
# zones, so it moves in steps of about 11 %; weapon starts between 22 % and 78 %.
#   Range 0.0 to 100.0 %   Default 27.5 %
trigger.left.start = 27.5 %

# Weapon only: where the resisting band ends and the trigger breaks through.
# Close to start: a short, sharp click. Further away: a long, heavy pull.
#   Range 0.0 to 100.0 %   Default 62.7 %
trigger.left.end = 62.7 %

# Force for resist and weapon, amplitude for vibrate.
# Higher: a heavier pull (or stronger buzz) - more feel, more finger fatigue on long
# flights. Lower: lighter. The trigger has 8 force levels, so it moves in steps of
# about 14 %, and 0 % is the lightest level, not off (use mode = off for that).
#   Range 0.0 to 100.0 %   Default 78.4 %
trigger.left.strength = 78.4 %

# Vibrate only: how fast the trigger vibrates.
# Lower: a slow, coarse rumble. Higher: a faster, finer buzz.
#   Range 1 to 255 Hz   Default 40 Hz
trigger.left.frequency = 40 Hz

# Effect on R2 (right trigger):
# off, resist (constant force past a point), weapon (resists across a band, then breaks
# through like a gun trigger) or vibrate.
#   One of: off, resist, weapon, vibrate   Default off
trigger.right.mode = off

# Where the effect begins, as a share of trigger travel (vibrate: the threshold).
# Lower: you feel it almost at once. Higher: free travel first. The trigger has 10
# zones, so it moves in steps of about 11 %; weapon starts between 22 % and 78 %.
#   Range 0.0 to 100.0 %   Default 27.5 %
trigger.right.start = 27.5 %

# Weapon only: where the resisting band ends and the trigger breaks through.
# Close to start: a short, sharp click. Further away: a long, heavy pull.
#   Range 0.0 to 100.0 %   Default 62.7 %
trigger.right.end = 62.7 %

# Force for resist and weapon, amplitude for vibrate.
# Higher: a heavier pull (or stronger buzz) - more feel, more finger fatigue on long
# flights. Lower: lighter. The trigger has 8 force levels, so it moves in steps of
# about 14 %, and 0 % is the lightest level, not off (use mode = off for that).
#   Range 0.0 to 100.0 %   Default 78.4 %
trigger.right.strength = 78.4 %

# Vibrate only: how fast the trigger vibrates.
# Lower: a slow, coarse rumble. Higher: a faster, finer buzz.
#   Range 1 to 255 Hz   Default 40 Hz
trigger.right.frequency = 40 Hz

# ===== Wind model =====
# How trigger.source = wind turns X-Plane's airflow into trigger force.

# Indicated airspeed at which the rudder triggers reach full force.
# Force grows with the square of airspeed, like a real rudder pedal, so at half this
# speed you feel a quarter of the airspeed force. Set it near your aircraft's cruise
# speed: about 110 kt for a C172, 160 kt for a Baron, 300 kt for an airliner.
# Lower: the triggers stiffen early in the takeoff roll and are rock hard in cruise.
# Higher: light, easy pedals; on a slow aircraft you may never feel much force.
#   Range 40 to 600 kt   Default 160 kt
wind.full_force_airspeed = 160 kt

# Below this indicated airspeed the triggers are free (parked, slow taxi). Raise it if
# the pedals stiffen while taxiing.
#   Range 0 to 60 kt   Default 5 kt
wind.no_airflow_below = 5 kt

# Trigger travel before wind resistance starts, like slack in a rudder cable.
# Higher: more free movement first. Lower: force from the very start.
#   Range 0.0 to 90.0 %   Default 11.8 %
wind.free_play = 11.8 %

# Resistance at any airflow. Higher: the pedals always feel loaded. Lower: light pedals
# at low speed.
#   Range 0.0 to 100.0 %   Default 11.8 %
wind.base_force = 11.8 %

# Extra resistance added at full_force_airspeed. Higher: pedals get much heavier as you
# speed up. Lower: airspeed changes are felt less.
#   Range 0.0 to 100.0 %   Default 78.4 %
wind.airspeed_force = 78.4 %

# Crosswind (the part across the nose) that gives the full left/right bias.
# Lower: even light crosswinds make one pedal clearly heavier. Higher: only strong ones.
#   Range 2.0 to 60.0 kt   Default 23.3 kt
wind.crosswind_full = 23.3 kt

# How far a full crosswind shifts force between the pedals: the pedal into the wind gets
# this much heavier and the other this much lighter. 0 % turns the bias off.
#   Range 0.0 to 100.0 %   Default 45.0 %
wind.crosswind_bias = 45.0 %

# Turbulence (X-Plane's 0-10 scale, at the aircraft's altitude) above which the triggers
# buzz instead of resisting. Lower: buffet in light chop. Higher: only in severe turbulence.
#   Range 0.0 to 10.0   Default 1.5
wind.buffet_turbulence = 1.5

# Trigger travel where the buffet vibration begins.
# Lower: you feel the buffet with the trigger barely pressed. Higher: only when pressed in.
#   Range 0.0 to 100.0 %   Default 7.8 %
wind.buffet_start = 7.8 %

# Buffet amplitude just above the turbulence threshold.
# Higher: even light buffet is felt clearly. Lower: light buffet is a faint tremor.
#   Range 0.0 to 100.0 %   Default 23.5 %
wind.buffet_strength_min = 23.5 %

# Buffet amplitude at turbulence 10 (scales between min and max with turbulence).
# Higher: severe turbulence really shakes the triggers. Lower: a gentler ceiling.
#   Range 0.0 to 100.0 %   Default 94.1 %
wind.buffet_strength_max = 94.1 %

# Buffet frequency just above the threshold: low is a slow, heavy shudder.
#   Range 1 to 255 Hz   Default 18 Hz
wind.buffet_frequency_min = 18 Hz

# Buffet frequency at turbulence 10: high is a fast, harsh buzz.
#   Range 1 to 255 Hz   Default 40 Hz
wind.buffet_frequency_max = 40 Hz

# ===== Rumble =====

# manual: the motors run only from the mapper's test buttons.
# sim: the flight model sets them - stall buffet per wing, g-load jolts, and a crash shake.
#   One of: manual, sim   Default manual
rumble.source = manual

# classic works on most DualSense firmware. v2 is the newer vibration path; on some
# firmware it produces no rumble at all. Try v2 only if classic does nothing.
#   One of: classic, v2   Default classic
rumble.path = classic

# How hard both motors buzz on a straight-ahead stall warning, before either wing
# actually stalls. Higher: an earlier, stronger warning. Lower: rely on the per-wing
# buffet, which tells you which wing is dropping.
#   Range 0.0 to 100.0 %   Default 60.0 %
rumble.stall_warning_floor = 60.0 %

# Load factor where a jolt begins (hard landing, steep pull-up).
# Lower: firm landings and brisk turns rumble. Higher: only really hard landings do.
#   Range 1.0 to 10.0 g   Default 2.5 g
rumble.g_jolt_start = 2.5 g

# Load factor of a full-strength jolt; between the two the jolt grows in proportion.
# Must be at least 0.5 g above g_jolt_start. Lower: moderate loads already hit hard.
# Higher: a gentler build-up, full strength only for real overstress.
#   Range 1.5 to 15.0 g   Default 6.0 g
rumble.g_jolt_full = 6.0 g

# How long both motors shake at full power after a crash. 0 turns the crash shake off.
# Higher: an unmistakable crash cue. Lower: a short jolt that does not drag on while
# X-Plane shows its crash screen.
#   Range 0.0 to 30.0 s   Default 3.0 s
rumble.crash_duration = 3.0 s

# ===== Light bar =====

# yes: DSXP controls the light bar and player lamps. no: both stay dark.
#   yes or no   Default yes
light.on = yes

# manual: the color and pattern below.
# sim: the bar is an annunciator - green clean, amber caution, red stall, flashing red
# crash, cyan turbulence.
#   One of: manual, sim   Default manual
light.source = manual

# Light bar color in manual mode.
#   #RRGGBB   Default #005AFF
light.color = #005AFF

# solid, breathe (slow fade), pulse (quick rise, slow decay), strobe, rainbow, or alert
# (alternates with amber).
#   One of: solid, breathe, pulse, strobe, rainbow, alert   Default solid
light.pattern = solid

# Pattern speed: 0 % is one cycle every 4 seconds, 100 % is 2.5 cycles a second.
#   Range 0.0 to 100.0 %   Default 50.0 %
light.speed = 50.0 %

# Light bar brightness. Lower: easier on the eyes in a dark room, and slightly longer
# battery life. Higher: readable as an annunciator in a bright room.
#   Range 0.0 to 100.0 %   Default 100.0 %
light.brightness = 100.0 %

# The five small lamps under the touchpad: off, single (center), two, three, four, all,
# or a pattern such as x...x (x lit, . dark, left to right).
#   off, single, two, three, four, all, or a pattern like x...x   Default single
light.player_lamps = single

# Sim mode: stall warning level (X-Plane's stall warning ratio) where the bar pulses red.
# Lower: red earlier as you approach the stall.
#   Range 1.0 to 100.0 %   Default 60.0 %
light.sim.stall_alarm = 60.0 %

# Stall warning level where the bar turns amber. Must stay below the alarm level.
# Lower: amber as soon as the warning starts building. Higher: amber only close to red.
#   Range 0.0 to 99.0 %   Default 15.0 %
light.sim.stall_caution = 15.0 %

# Load factor, positive or negative, that shows amber (level flight is 1 g).
# Lower: steep turns and firm pull-ups light it. Higher: only aerobatic loads.
#   Range 1.0 to 10.0 g   Default 2.5 g
light.sim.g_caution = 2.5 g

# Turbulence (X-Plane's 0-10 scale) that shows cyan.
# Lower: cyan in light chop. Higher: only in strong turbulence.
#   Range 0.0 to 10.0   Default 1.5
light.sim.turbulence_caution = 1.5
