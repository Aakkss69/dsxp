# DSXP bridge settings (format 1)
#
# How DSXP talks to X-Plane: its network port, how often DSXP does things, and logging.
#
# DSXP applies changes to this file within about 2 seconds while it runs.
# DSXP creates this file once and never writes it again.
# A line DSXP cannot use is ignored and listed in the mapper and the menu.
# Delete a line to use its default; delete the file to reset all of it.

# ===== X-Plane connection =====

# X-Plane's UDP port for incoming data (X-Plane: Settings > Network > UDP ports).
# Leave it at 49000 unless you changed that port in X-Plane: the two must match, or
# X-Plane ignores everything DSXP sends and the menu shows "running, not answering".
# Do not use 49010: it belongs to X-Plane's multiplayer networking.
#   Range 1024 to 65535   Default 49000
xplane.port = 49000

# ===== Timing =====

# How many times a second DSXP reads the controller and sends it to X-Plane.
# Higher: lower control latency (60 Hz adds at most about 17 ms, 120 Hz about 8 ms),
# for more packets and CPU. Over Bluetooth the controller reports about 62 times a
# second, so going far above that gains little.
# Lower: less work, but control feels steppy and laggy, most of all in the flare.
#   Range 30 to 120 Hz   Default 60 Hz
timing.tick_rate = 60 Hz

# How fast a button set to "hold" repeats its command while held (trim, zoom, views).
# Higher: trim and views move faster while held, but are harder to stop exactly.
# Lower: slower, more precise steps.
#   Range 1 to 60 Hz   Default 20 Hz
timing.button_repeat_rate = 20 Hz

# If no controller report arrives for this long, DSXP holds the stick axes at center
# and releases every button instead of repeating the last values.
# Lower: a Bluetooth dropout, or a controller switched off mid-turn, centers the
# controls sooner; too low and normal Bluetooth hiccups cause brief twitches to center
# (reports arrive about every 16 ms). Higher: rides out longer hiccups, but after a
# real dropout the aircraft keeps the last stick deflection for this long.
#   Range 50 to 2000 ms   Default 250 ms
timing.input_stale = 250 ms

# If no controller report arrives for this long, DSXP disengages and gives X-Plane its
# controls back. Lower: X-Plane's own joystick or mouse takes over sooner after the
# controller dies. Higher: short Bluetooth losses do not bounce control back and forth.
#   Range 0.5 to 10.0 s   Default 2.0 s
timing.input_lost = 2.0 s

# How often DSXP repeats "DSXP is flying this axis" to X-Plane while engaged.
# X-Plane drops these overrides if it was not listening yet, and (observed) when an
# aircraft is reloaded; until the next repeat the stick does nothing.
# Lower: control comes back sooner after a reload, for a few more tiny packets that
# never leave this Mac. Higher: fewer packets, but after a reload the stick can be dead
# for up to this long. Release messages for an axis handed back use the same spacing.
#   Range 0.2 to 10.0 s   Default 1.0 s
timing.override_reassert = 1.0 s

# How many extra times DSXP repeats "release this axis" after handing an axis back to
# X-Plane (unmapping it, disengaging), in case X-Plane was busy and dropped the first.
# Higher: safer when X-Plane is loading or stuttering at that moment. Lower: fewer packets.
#   Range 1 to 10   Default 3
timing.override_release_repeats = 3

# The throttle has no override, so DSXP sends it only when the stick moves, plus this
# keepalive. Lower: X-Plane's throttle snaps back to your stick sooner after something
# else moved it. Higher, or 0 to turn it off: the autothrottle, mouse or keyboard can move
# the throttle without DSXP putting it back.
#   Range 0.0 to 60.0 s   Default 5.0 s
timing.throttle_keepalive = 5.0 s

# How often DSXP checks whether X-Plane is running and whether the controller is on USB
# or Bluetooth. Lower: engages sooner after X-Plane starts and steps aside sooner when you
# plug in the cable; each check scans the process list, a small CPU cost. Higher: slower
# to notice either.
#   Range 0.5 to 10.0 s   Default 2.0 s
timing.gate_poll = 2.0 s

# After a change in the mapper, DSXP waits this long for more changes before writing
# controls.conf or feedback.conf. Lower: saved sooner. Higher: fewer disk writes while
# you drag a slider.
#   Range 100 to 5000 ms   Default 500 ms
timing.save_delay = 500 ms

# ===== Telemetry =====
# Flight data X-Plane sends back: airspeed, stall, g-load, turbulence and so on.
# It feeds the wind trigger effects, simulator rumble and the simulator light bar, and its arrival
# is how DSXP knows X-Plane is answering.

# How many times a second X-Plane sends the flight data.
# Higher: triggers and rumble react faster (the stall buzz starts sooner).
# Lower: less traffic, but feedback lags the aircraft.
#   Range 1 to 30 Hz   Default 10 Hz
telemetry.rate = 10 Hz

# If no flight data arrives for this long, DSXP treats X-Plane as gone: sim rumble and
# wind triggers stop and the bridge disengages. Lower: rumble stops sooner if X-Plane
# hangs; too low and X-Plane's short stalls while loading scenery switch feedback off
# and on. It must cover at least three telemetry periods.
#   Range 1.0 to 30.0 s   Default 3.0 s
telemetry.timeout = 3.0 s

# While no flight data arrives, DSXP asks X-Plane for it again this often (X-Plane may
# drop the request across reloads). Lower: feedback returns sooner after a reload.
#   Range 1.0 to 60.0 s   Default 5.0 s
telemetry.resubscribe = 5.0 s

# ===== Logging =====
# Logs are in ~/Library/Logs/DSXP (menu: Open Logs Folder).

# Log files older than this are deleted. Higher keeps more history for troubleshooting.
#   Range 1 to 365 days   Default 14 days
log.retention_days = 14 days

# A single day's log file stops growing at this size (later lines that day are dropped).
# Higher: a long verbose session is logged in full, for more disk space.
# Lower: less disk space, but the end of a busy day may be missing.
#   Range 1 to 100 MB   Default 5 MB
log.file_cap = 5 MB

# Length of each controller report-rate window in the reports log (also the Hz shown in
# the menu). Shorter: the rate reacts faster but is noisier.
#   Range 1 to 300 s   Default 10 s
log.report_window = 10 s

# With nothing happening, a report line is written only this often.
# Lower: a steady heartbeat in the reports log (shows DSXP was alive). Higher: quieter logs.
#   Range 60 to 86400 s   Default 3600 s
log.idle_report_interval = 3600 s

# yes: also log every command sent to X-Plane. Useful when a binding seems to do
# nothing; the logs grow quickly.
#   yes or no   Default no
log.verbose = no
