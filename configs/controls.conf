# DSXP controls settings (format 1)
#
# What the controller does in X-Plane: sticks, touchpad gestures, axes and buttons.
#
# DSXP applies changes to this file within about 2 seconds while it runs.
# The mapper window also writes this file: your values are kept, but comments
# you add yourself are lost when it does.
# A line DSXP cannot use is ignored and listed in the mapper and the menu.
# Delete a line to use its default; delete the file to reset all of it.

# ===== Sticks =====

# How far a stick must leave center before DSXP sends any input to X-Plane.
# DSXP sends your stick input to X-Plane through override datarefs; X-Plane's null zone does not
# apply to them (observed), so this is the only thing filtering stick drift.
# Raise it if the aircraft rolls or pitches by itself with your thumbs off the sticks
# (worn sticks rest a few percent off center). Lower it for finer corrections in the
# flare or on a localizer; too low and hands-off flight wanders.
# Steps under 0.8 % do nothing (the stick has 127 steps each way).
#   Range 0.0 to 45.0 %   Default 6.0 %
stick.deadzone = 6.0 %

# Response curve, applied after the deadzone. 1.00 is linear.
# Above 1: softer around center with full deflection unchanged - finer control for small
# corrections (holding altitude, the flare), but brisk maneuvers need bigger movements.
# Below 1: more sensitive around center - quick and twitchy, harder to fly smoothly.
#   Range 0.40 to 3.00   Default 1.00
stick.curve = 1.00

# ===== Touchpad gestures =====

# How easily swipes and taps are recognized. It moves the swipe and tap limits below
# between their "at_0" and "at_100" values.
# Higher: short flicks count as swipes - quick, but a thumb resting on the pad can
# trigger one. Lower: only deliberate strokes count.
#   Range 0.0 to 100.0 %   Default 50.0 %
gesture.sensitivity = 50.0 %

# A touch must lift within this time to count as a tap. Higher: slow taps still count,
# but a short press-and-hold does too. Lower: only quick taps count.
#   Range 100 to 1000 ms   Default 350 ms
gesture.tap_time = 350 ms

# How long a recognized gesture holds its button down. It must last at least 1.5 ticks
# so the loop sees it. Higher: a gesture bound to a "hold" command repeats a few times.
# Lower: one clean press.
#   Range 20 to 500 ms   Default 80 ms
gesture.pulse = 80 ms

# Shortest swipe, as a share of the pad width, when gesture.sensitivity is 0 %.
# Higher: at low sensitivity only long, deliberate strokes count. Lower: shorter ones do.
#   Range 5.0 to 80.0 %   Default 30.0 %
gesture.swipe_length_at_0 = 30.0 %

# Shortest swipe when gesture.sensitivity is 100 %. Must stay above tap_wander_at_100.
# Lower: at high sensitivity a small flick is a swipe.
# Higher: even at high sensitivity a real stroke is needed.
#   Range 2.0 to 50.0 %   Default 8.0 %
gesture.swipe_length_at_100 = 8.0 %

# Largest finger movement that still counts as a tap, at sensitivity 0 %.
# Higher: sloppy taps still count. Lower: a tap must land and lift in place.
#   Range 1.0 to 20.0 %   Default 7.0 %
gesture.tap_wander_at_0 = 7.0 %

# Largest finger movement that still counts as a tap, at sensitivity 100 %.
# Must stay below swipe_length_at_100, or every short swipe reads as a tap.
#   Range 1.0 to 20.0 %   Default 4.0 %
gesture.tap_wander_at_100 = 4.0 %

# ===== Axes =====
# Each stick axis and analog trigger moves one X-Plane control: none, roll, pitch, yaw,
# throttle, rudder_left, rudder_right, brake_left or brake_right. Add "inverted" to
# reverse it. rudder_left and rudder_right use the two triggers as differential rudder
# pedals. An axis set to none is left entirely to X-Plane.
# Left stick X. Default: roll
axis.left_x = roll
# Left stick Y. Default: pitch
axis.left_y = pitch
# Right stick X. Default: yaw
axis.right_x = yaw
# Right stick Y. Default: none
axis.right_y = none
# L2 trigger. Default: rudder_left
axis.l2 = rudder_left
# R2 trigger. Default: rudder_right
axis.r2 = rudder_right

# ===== Motion control =====
# Fly by tilting the controller: bank it to roll, raise or lower its top edge to pitch,
# twist it flat to yaw. Hold it the way "level" should feel and press Recenter in the
# mapper (or a button bound to dsxp/motion/recenter). Each axis is flown by motion or by
# the sticks, never both; an axis left on sticks works exactly as set under Axes.
# Yaw is hold-to-steer: twist to apply rudder and the twist eases back to center by
# itself; turning the controller back never overshoots into opposite rudder.
# Face down or stood on its edge, the controller holds every motion axis neutral.

# yes: the axes set to motion below follow the controller's tilt.
# no: the sticks and triggers fly everything, as set under Axes.
#   yes or no   Default no
motion.enabled = no

# What flies roll (ailerons): motion (bank the controller) or sticks.
# With motion, any stick set to roll is ignored.
#   One of: sticks, motion   Default motion
motion.roll = motion

# What flies pitch (elevator): motion (raise the top edge to pull, lower it to push) or
# sticks. With motion, any stick set to pitch is ignored.
#   One of: sticks, motion   Default motion
motion.pitch = motion

# What flies yaw (rudder): motion (twist the controller about its face, like a steering
# wheel lying flat) or sticks. With motion, the rudder triggers and any stick set to yaw
# are ignored.
#   One of: sticks, motion   Default sticks
motion.yaw = sticks

# Controller bank that gives full aileron.
# Lower: more sensitive - small tilts roll hard; quick, but twitchy on an approach.
# Higher: gentler and more precise, but a steep turn needs a bigger wrist movement.
#   Range 10 to 90 deg   Default 40 deg
motion.roll.full = 40 deg

# Tilt of the top edge, up or down, that gives full elevator.
# Lower: small tilts pitch hard - quick, but easy to over-control in the flare.
# Higher: finer control of attitude, but a full pull needs a big tilt.
#   Range 10 to 60 deg   Default 30 deg
motion.pitch.full = 30 deg

# Twist that gives full rudder.
# Lower: a small twist kicks in full rudder - fine for crosswind corrections on short
# final, harsh in flight. Higher: gentler rudder, more twist for a full slip.
#   Range 5 to 90 deg   Default 30 deg
motion.yaw.full = 30 deg

# Roll and pitch: tilt from level that does nothing, so hand tremor and resting your
# arms do not move the controls. Higher: steadier hands-off flight, but small
# corrections need a deliberate tilt. Lower: finer corrections, more wander.
#   Range 0.0 to 10.0 deg   Default 2.0 deg
motion.deadzone = 2.0 deg

# Yaw: twist from center that does nothing. The rudder stays where you leave it (twist
# back, or Recenter, to center it), and the gyro's slow drift is taken out while you
# hold still, so a few degrees is plenty. Higher: the rudder stays centered unless you
# mean it. Lower: smaller twists already move the rudder.
#   Range 0.0 to 20.0 deg   Default 4.0 deg
motion.yaw.deadzone = 4.0 deg

# yes: banking the controller right rolls left.
#   yes or no   Default no
motion.roll.invert = no

# yes: raising the top edge pushes the nose down.
#   yes or no   Default no
motion.pitch.invert = no

# yes: twisting right gives left rudder.
#   yes or no   Default no
motion.yaw.invert = no

# Set to yes by the calibration in the mapper (Motion control > Calibrate). While it is
# no, the mapper asks for the calibration and motion control cannot be switched on.
# The full-deflection angles above are set by it too; edit them afterwards if you like.
#   yes or no   Default no
motion.calibrated = no

# How you hold the controller to fly level, measured by the calibration: its bank from
# lying flat (right side down is positive). Recenter overrides it until motion control
# is switched off or DSXP restarts.
#   Range -60.0 to 60.0 deg   Default 0.0 deg
motion.level.bank = 0.0 deg

# ... and its pitch from lying flat (top edge up is positive). Lying face up on a table
# the controller rests on its grips, about 6 deg top edge up.
#   Range -60.0 to 60.0 deg   Default 0.0 deg
motion.level.pitch = 0.0 deg

# The gyro's resting drift on each axis, measured by the calibration with the controller
# lying still (typically under 1 deg/s). DSXP keeps refining it whenever the controller
# is still, so there is no need to edit it.
#   Range -10.000 to 10.000 deg/s   Default 0.000 deg/s
motion.gyro_bias.x = 0.000 deg/s

# Resting drift of the gyro's y axis (the twist axis).
#   Range -10.000 to 10.000 deg/s   Default 0.000 deg/s
motion.gyro_bias.y = 0.000 deg/s

# Resting drift of the gyro's z axis (the roll axis).
#   Range -10.000 to 10.000 deg/s   Default 0.000 deg/s
motion.gyro_bias.z = 0.000 deg/s

# ===== Buttons =====
# Each control sends one X-Plane command. Write the command path as X-Plane lists it
# (Resources/plugins/Commands.txt in your X-Plane folder, or search in the mapper), then
# "hold" to repeat it while held (trim, zoom, views) or "once" for one send per press
# (gear, flaps). "none" leaves the control unassigned. D-pad diagonals and touchpad
# gestures count as buttons too.
# D-pad up. Default: none
button.dpad_up = none
# D-pad up-right. Default: sim/general/hat_switch_up_right hold
button.dpad_up_right = sim/general/hat_switch_up_right hold
# D-pad right. Default: sim/flight_controls/landing_gear_down once
button.dpad_right = sim/flight_controls/landing_gear_down once
# D-pad down-right. Default: sim/general/hat_switch_down_right hold
button.dpad_down_right = sim/general/hat_switch_down_right hold
# D-pad down. Default: sim/flight_controls/flaps_down once
button.dpad_down = sim/flight_controls/flaps_down once
# D-pad down-left. Default: sim/general/hat_switch_down_left hold
button.dpad_down_left = sim/general/hat_switch_down_left hold
# D-pad left. Default: sim/flight_controls/landing_gear_up once
button.dpad_left = sim/flight_controls/landing_gear_up once
# D-pad up-left. Default: sim/general/hat_switch_up_left hold
button.dpad_up_left = sim/general/hat_switch_up_left hold
# Square. Default: sim/general/left hold
button.square = sim/general/left hold
# Cross. Default: sim/engines/throttle_down hold
button.cross = sim/engines/throttle_down hold
# Circle. Default: sim/general/right hold
button.circle = sim/general/right hold
# Triangle. Default: sim/engines/throttle_up hold
button.triangle = sim/engines/throttle_up hold
# L1. Default: sim/general/zoom_out hold
button.l1 = sim/general/zoom_out hold
# R1. Default: sim/general/zoom_in hold
button.r1 = sim/general/zoom_in hold
# L2 click. Default: none
button.l2_click = none
# R2 click. Default: none
button.r2_click = none
# Create. Default: none
button.create = none
# Options. Default: none
button.options = none
# L3 (left stick click). Default: sim/flight_controls/pitch_trim_down hold
button.l3 = sim/flight_controls/pitch_trim_down hold
# R3 (right stick click). Default: sim/flight_controls/pitch_trim_up hold
button.r3 = sim/flight_controls/pitch_trim_up hold
# PS. Default: none
button.ps = none
# Touchpad click. Default: none
button.touchpad_click = none
# Mute. Default: none
button.mute = none
# Tap. Default: none
button.tap = none
# Two-finger tap. Default: none
button.two_finger_tap = none
# Swipe left. Default: none
button.swipe_left = none
# Swipe right. Default: none
button.swipe_right = none
# Swipe up. Default: none
button.swipe_up = none
# Swipe down. Default: none
button.swipe_down = none
# Swipe up-left. Default: none
button.swipe_up_left = none
# Swipe up-right. Default: none
button.swipe_up_right = none
# Swipe down-left. Default: none
button.swipe_down_left = none
# Swipe down-right. Default: none
button.swipe_down_right = none
